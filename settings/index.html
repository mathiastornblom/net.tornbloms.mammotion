<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>
<body>

  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.title"></h1>
  </header>

  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label class="homey-form-checkbox">
        <input class="homey-form-checkbox-input" type="checkbox" id="crashReporting">
        <span class="homey-form-checkbox-checkmark"></span>
        <span class="homey-form-checkbox-text" data-i18n="settings.crash_reporting.label"></span>
      </label>
      <p class="homey-form-help" data-i18n="settings.crash_reporting.hint"></p>
    </div>
  </fieldset>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.advanced_section"></legend>
    <div class="homey-form-group">
      <label class="homey-form-checkbox">
        <input class="homey-form-checkbox-input" type="checkbox" id="debugLogging">
        <span class="homey-form-checkbox-checkmark"></span>
        <span class="homey-form-checkbox-text" data-i18n="settings.debug_logging.label"></span>
      </label>
      <p class="homey-form-help" data-i18n="settings.debug_logging.hint"></p>
    </div>
  </fieldset>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      var crashReporting = document.getElementById('crashReporting');
      var debugLogging = document.getElementById('debugLogging');

      Homey.get('crashReporting', function (err, value) {
        // Default is on: only an explicit false means the user opted out.
        crashReporting.checked = value !== false;
      });
      crashReporting.addEventListener('change', function () {
        Homey.set('crashReporting', crashReporting.checked);
      });

      Homey.get('debugLogging', function (err, value) {
        // Default is off: verbose, only meant to be turned on temporarily.
        debugLogging.checked = value === true;
      });
      debugLogging.addEventListener('change', function () {
        Homey.set('debugLogging', debugLogging.checked);
      });

      Homey.ready();
    }
  </script>

</body>
</html>
